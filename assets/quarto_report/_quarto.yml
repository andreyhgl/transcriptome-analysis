author: "Andrey Höglund"
date:   today

format:
  html:
    css:   styles.css
    theme: pulse

    other-links:
      - text: karlssonlab.se
        icon: house-door-fill
        href: https://karlssonlab.se/
      - text: Github
        icon: github
        href: https://github.com/KarlssonLaboratory

    code-links:
      - text: Source on GitHub
        icon: github
        href: https://github.com/andreyhgl/transcriptome-analysis

    linestretch:   1.5
    toc:           true
    toc-location:  left
    smooth-scroll: true
    code-fold:     true
    code-tools:    true

output-file: results_transcriptome
output-ext:  html

embed-resources:    true
warning:            false
echo:               false
callout-appearance: default
callout-icon:       true
